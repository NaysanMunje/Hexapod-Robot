; ESP32-S3 + 2× PCA9685 hexapod firmware
; Upload/monitor default to COM4 — change if the board enumerates elsewhere.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = COM4
monitor_port = COM4
lib_deps =
  adafruit/Adafruit PWM Servo Driver Library @ ^3.0.2
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
